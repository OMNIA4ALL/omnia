<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OMNIA 2.0 - Offline Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 440px;
      padding: 32px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
    }
    h1 { color: #818cf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OMNIA 2.0 Offline</h1>
    <p>You are currently offline. Local utilities including calculators, unit converters, personal workspace notes, physics simulations, and code playground remain functional.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
