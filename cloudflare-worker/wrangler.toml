name = "omnia-ai-worker"
main = "worker.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://omnia4all.github.io"
# Optional: Set a strict daily message limit per user (0 = rely on Cloudflare account quota only)
DAILY_MESSAGE_LIMIT = "10"
# Optional: Add your Cloudflare Turnstile Site Key here (and set TURNSTILE_SECRET via `wrangler secret put`)
TURNSTILE_SITE_KEY = ""

# Optional but REQUIRED for tamper-proof daily quota enforcement across sessions/restarts:
# 1. Run: npx wrangler kv namespace create QUOTA_KV
# 2. Uncomment the block below and replace <YOUR_KV_NAMESPACE_ID> with the returned ID:
# [[kv_namespaces]]
# binding = "QUOTA_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"
